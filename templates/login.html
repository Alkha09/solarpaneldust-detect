<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SolarSense | Sign in</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #06152f;
      --card: rgba(10, 29, 62, 0.78);
      --border: rgba(132, 166, 255, 0.35);
      --text: #f6f8ff;
      --muted: #9eafd0;
      --blue: #4b9cff;
      --purple: #9b62ff;
      --cyan: #49d8ff;
      --green: #46e0a5;
      --error: #f8b4b4;
      --error-bg: rgba(127, 29, 29, 0.45);
    }

    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      overflow-x: hidden;

      background:
        radial-gradient(circle at 72% 50%, rgba(82, 117, 255, 0.35), transparent 30%),
        radial-gradient(circle at 35% 25%, rgba(155, 98, 255, 0.18), transparent 30%),
        linear-gradient(135deg, #020b1c 0%, #071b3c 45%, #0b2450 100%);
    }

    body::before {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(92, 101, 255, 0.12);
      filter: blur(100px);
      top: -180px;
      right: -120px;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(58, 205, 255, 0.08);
      filter: blur(100px);
      bottom: -150px;
      left: -100px;
      pointer-events: none;
    }

    .solar-background {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      opacity: 0.38;
    }

    .solar-background::before {
      content: "";
      position: absolute;
      width: 75%;
      height: 55%;
      right: -8%;
      bottom: -5%;
      transform: perspective(700px) rotateX(55deg) rotateZ(-12deg);
      background:
        repeating-linear-gradient(90deg, rgba(80, 153, 255, 0.32) 0 2px, transparent 2px 90px),
        repeating-linear-gradient(0deg, rgba(80, 153, 255, 0.25) 0 2px, transparent 2px 55px),
        linear-gradient(135deg, #071d42, #122f63);
      box-shadow: 0 0 80px rgba(64, 135, 255, 0.18);
    }

    .solar-background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(4, 16, 37, 0.95) 0%, rgba(4, 16, 37, 0.72) 35%, rgba(4, 16, 37, 0.35) 70%, rgba(4, 16, 37, 0.7) 100%);
    }

    .page {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      padding: 32px 5vw 20px;
      display: flex;
      align-items: center;
      position: relative;
      z-index: 5;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 58px;
      height: 58px;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(255, 185, 78, 0.25), rgba(74, 146, 255, 0.25));
      border: 1px solid rgba(133, 176, 255, 0.35);
      box-shadow: 0 0 25px rgba(74, 155, 255, 0.15);
    }

    .sun {
      font-size: 30px;
    }

    .brand-name {
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-name span {
      background: linear-gradient(90deg, #9d6cff, #6ca9ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin-top: 3px;
      color: #91a8d0;
      font-size: 14px;
    }

    .content {
      flex: 1;
      width: min(1400px, 90%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      align-items: center;
      gap: 70px;
      padding: 30px 0 50px;
    }

    .hero {
      max-width: 680px;
    }

    .hero h1 {
      font-size: clamp(42px, 5vw, 70px);
      line-height: 1.08;
      font-weight: 400;
      letter-spacing: -2px;
      margin-bottom: 22px;
    }

    .hero h1 strong {
      display: block;
      background: linear-gradient(90deg, #9c69ff, #7a9dff, #6dd9ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 750;
    }

    .hero-description {
      max-width: 580px;
      font-size: 18px;
      line-height: 1.75;
      color: #aec0df;
      margin-bottom: 35px;
    }

    .features {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .feature-icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(67, 129, 255, 0.30), rgba(118, 75, 255, 0.22));
      border: 1px solid rgba(112, 157, 255, 0.35);
      font-size: 21px;
      box-shadow: inset 0 0 20px rgba(116, 141, 255, 0.08), 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .feature-text h3 {
      font-size: 15px;
      margin-bottom: 4px;
    }

    .feature-text p {
      color: #91a6c9;
      font-size: 13px;
    }

    .quote {
      margin-top: 45px;
      padding-left: 18px;
      border-left: 3px solid #9b62ff;
      color: #b6c5df;
      font-style: italic;
      font-size: 15px;
      line-height: 1.6;
    }

    .login-wrapper {
      display: flex;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 500px;
      padding: 44px 42px;
      background: linear-gradient(145deg, rgba(19, 42, 84, 0.86), rgba(5, 20, 48, 0.82));
      border: 1px solid var(--border);
      border-radius: 26px;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 35px 90px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: cardIn 0.8s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-heading {
      text-align: center;
      margin-bottom: 35px;
    }

    .login-heading h2 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .login-heading p {
      color: #9eb1d3;
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .input-container {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 17px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      color: #9bb7eb;
      pointer-events: none;
    }

    input {
      width: 100%;
      height: 72px;
      border-radius: 15px;
      border: 1px solid rgba(100, 143, 221, 0.42);
      background: rgba(7, 24, 55, 0.72);
      color: white;
      padding: 25px 48px 8px 58px;
      outline: none;
      font-size: 15px;
      transition: 0.25s;
    }

    input:focus {
      border-color: #7b86ff;
      box-shadow: 0 0 0 3px rgba(117, 91, 255, 0.13), 0 0 25px rgba(88, 105, 255, 0.08);
    }

    .floating-label {
      position: absolute;
      left: 58px;
      top: 15px;
      color: #b7c7e4;
      font-size: 12px;
      pointer-events: none;
    }

    input::placeholder {
      color: #657da7;
    }

    .password-toggle {
      position: absolute;
      right: 17px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #7f95bb;
      cursor: pointer;
      font-size: 18px;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 18px 3px 25px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #aabbd7;
      cursor: pointer;
    }

    .remember input {
      width: 17px;
      height: 17px;
      padding: 0;
      accent-color: #6f83ff;
    }

    .forgot {
      color: #ae7cff;
      text-decoration: none;
    }

    .forgot:hover {
      color: #c4a0ff;
    }

    .sign-in {
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(100deg, #a35fff, #716cff, #409bff);
      color: white;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 12px 30px rgba(104, 89, 255, 0.28);
    }

    .sign-in:hover {
      transform: translateY(-2px);
      box-shadow: 0 17px 38px rgba(104, 89, 255, 0.40);
    }

    .sign-in:active {
      transform: translateY(0);
    }

    .arrow {
      margin-left: 8px;
      font-size: 19px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 25px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(145, 168, 215, 0.2);
    }

    .divider span {
      color: #7186ac;
      font-size: 12px;
    }

    .google-btn {
      width: 100%;
      height: 55px;
      border-radius: 14px;
      border: 1px solid rgba(110, 148, 211, 0.4);
      background: rgba(7, 24, 54, 0.65);
      color: #e7edfb;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: 0.2s;
    }

    .google-btn:hover {
      background: rgba(31, 55, 97, 0.7);
      border-color: rgba(139, 167, 224, 0.6);
    }

    .google-icon {
      font-weight: 800;
      font-size: 20px;
      background: linear-gradient(45deg, #4285f4, #34a853, #fbbc05, #ea4335);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .signup {
      text-align: center;
      margin-top: 27px;
      color: #879abd;
      font-size: 13px;
    }

    .signup a {
      color: #ae7cff;
      font-weight: 600;
      text-decoration: none;
      margin-left: 5px;
    }

    .signup a:hover {
      color: #c8a8ff;
    }

    .error {
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid rgba(248, 180, 180, 0.5);
      border-radius: 10px;
      background: var(--error-bg);
      color: var(--error);
      font-size: 13px;
      line-height: 1.5;
    }

    footer {
      width: 100%;
      padding: 18px 5vw;
      display: flex;
      justify-content: flex-end;
      color: #7188ae;
      font-size: 12px;
    }

    .footer-content {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .footer-leaf {
      color: #52dba7;
      font-size: 16px;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 15px 20px;
      border-radius: 12px;
      background: rgba(13, 31, 65, 0.95);
      border: 1px solid rgba(108, 150, 225, 0.35);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      color: white;
      transform: translateY(100px);
      opacity: 0;
      transition: 0.3s;
      z-index: 20;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 950px) {
      .content {
        grid-template-columns: 1fr;
        gap: 50px;
        padding-top: 30px;
      }

      .hero {
        max-width: 700px;
        margin: auto;
      }

      .login-wrapper {
        width: 100%;
      }

      .login-card {
        max-width: 600px;
      }

      footer {
        justify-content: center;
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 20px;
      }

      .logo-icon {
        width: 45px;
        height: 45px;
      }

      .sun {
        font-size: 23px;
      }

      .brand-name {
        font-size: 22px;
      }

      .tagline {
        font-size: 11px;
      }

      .content {
        width: 90%;
      }

      .hero h1 {
        font-size: 40px;
      }

      .hero-description {
        font-size: 15px;
      }

      .login-card {
        padding: 30px 22px;
        border-radius: 20px;
      }

      .login-heading h2 {
        font-size: 28px;
      }

      .quote {
        display: none;
      }

      footer {
        padding-bottom: 25px;
      }
    }
    :root {
      --bg: #f3f5f4;
      --card: #ffffff;
      --border: #dce3df;
      --text: #202a25;
      --muted: #68736d;
      --blue: #287454;
      --purple: #1e6045;
      --cyan: #287454;
      --green: #287454;
      --error: #a4261d;
      --error-bg: #fdf0ef;
    }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    body::before, body::after, .solar-background { display: none; }
    header {
      padding: 16px 5vw;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .logo { gap: 11px; }
    .logo-icon {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 7px;
      background: #e9f2ed;
      box-shadow: none;
    }
    .sun { color: var(--blue); font-size: 22px; }
    .brand-name { color: var(--text); font-size: 1.05rem; letter-spacing: 0; }
    .brand-name span { color: var(--text); background: none; }
    .tagline { color: var(--muted); font-size: .8rem; }
    .content {
      width: 100%;
      max-width: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0;
      padding: 40px 20px;
    }
    .hero { display: none; }
    .login-wrapper { width: min(100%, 430px); }
    .login-card {
      max-width: none;
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 1px 3px rgba(23, 37, 30, .06);
      backdrop-filter: none;
      animation: none;
    }
    .login-heading { margin-bottom: 24px; text-align: left; }
    .login-heading h2 { margin-bottom: 6px; color: var(--text); font-size: 1.55rem; }
    .login-heading p { color: var(--muted); font-size: .9rem; }
    .form-group { margin-bottom: 16px; }
    .input-container { position: relative; }
    .input-icon { display: none; }
    .floating-label {
      position: static;
      display: block;
      margin-bottom: 6px;
      color: #3e4c44;
      font-size: .85rem;
      font-weight: 600;
    }
    input:not([type="checkbox"]) {
      width: 100%;
      height: 44px;
      padding: 10px 12px;
      border: 1px solid #cbd5cf;
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: .9rem;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:not([type="checkbox"]):focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(40, 116, 84, .12);
    }
    input::placeholder { color: #7b8780; }
    #password { padding-right: 64px; }
    .password-toggle {
      right: 8px;
      padding: 6px 8px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--blue);
      font-size: .8rem;
      font-weight: 600;
    }
    .form-options { display: none; }
    .sign-in {
      width: 100%;
      height: 44px;
      margin-top: 6px;
      border: 1px solid var(--purple);
      border-radius: 6px;
      background: var(--blue);
      color: #fff;
      font-size: .9rem;
      font-weight: 600;
      box-shadow: none;
      transition: background-color .15s ease;
    }
    .sign-in:hover { transform: none; background: var(--purple); box-shadow: none; }
    .arrow { display: none; }
    .divider, .google-btn { display: none; }
    .signup {
      margin-top: 22px;
      color: var(--muted);
      font-size: .86rem;
    }
    .signup a { color: var(--blue); }
    .signup a:hover { color: var(--purple); }
    .error {
      border-color: #efc7c3;
      border-radius: 6px;
      background: var(--error-bg);
      color: var(--error);
    }
    footer {
      justify-content: center;
      padding: 16px 20px;
      color: var(--muted);
    }
    .footer-content { gap: 8px; }
    .footer-leaf { display: none; }
    .toast { display: none; }
    @media (max-width: 600px) {
      header { padding: 14px 18px; }
      .content { padding: 28px 16px; }
      .login-card { padding: 26px 22px; border-radius: 8px; }
      footer { padding-bottom: 16px; }
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='auth-redesign.css') }}" />
</head>

<body class="login-page">
  <div class="page">
    <header>
      <div class="logo">
        <div class="logo-icon" aria-hidden="true">
          <svg class="solar-logo-icon" viewBox="0 0 32 32" focusable="false">
            <circle cx="16" cy="10" r="5"></circle>
            <path d="M16 1v2M7.5 4.5l1.4 1.4m14.2 0 1.4-1.4M3 10h3m20 0h3M9 19h14l3 10H6l3-10Zm2 0 1 10m8-10-1 10m-11-5h16"></path>
          </svg>
        </div>

        <div>
          <div class="brand-name">SolarSense</div>
          <div class="tagline">Panel monitoring</div>
        </div>
      </div>
    </header>

    <main class="content">
      <section class="login-wrapper">
        <div class="login-card">
          <div class="login-heading">
            <h2>Sign in</h2>
            <p>Enter your account details to continue.</p>
          </div>

          <form id="loginForm" method="post" action="/login">
            <div class="form-group">
              <label class="floating-label" for="username">Username</label>
              <input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username" aria-describedby="usernameHint" required />
              <span class="field-hint" id="usernameHint">Enter the username associated with your account.</span>
            </div>

            <div class="form-group">
              <div class="input-container">
                <label class="floating-label" for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" aria-describedby="passwordHint" required />
                <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password" aria-controls="password">
                  <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="eye-off-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4.1-.9"></path>
                  </svg>
                  <span class="sr-only">Show password</span>
                </button>
              </div>
              <span class="field-hint" id="passwordHint">Enter your account password.</span>
            </div>

            <button type="submit" class="sign-in" id="signInButton">
              <span class="button-spinner" aria-hidden="true"></span>
              <span id="signInButtonText">Sign in</span>
            </button>
            <p class="login-status sr-only" id="loginStatus" role="status" aria-live="polite"></p>

            {% if error %}
              <div class="error" role="alert">{{ error }}</div>
            {% endif %}
          </form>

          <div class="signup">
            Don't have an account?
            <a href="/register">Create account</a>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-content">
        <span>SolarSense</span>
        <span>|</span>
        <span>Panel monitoring</span>
      </div>
    </footer>
  </div>

  <script>
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const loginForm = document.getElementById("loginForm");
    const signInButton = document.getElementById("signInButton");
    const signInButtonText = document.getElementById("signInButtonText");
    const loginStatus = document.getElementById("loginStatus");

    togglePassword.addEventListener("click", () => {
      const showingPassword = passwordInput.type === "password";
      if (showingPassword) {
        passwordInput.type = "text";
        togglePassword.setAttribute("aria-label", "Hide password");
      } else {
        passwordInput.type = "password";
        togglePassword.setAttribute("aria-label", "Show password");
      }
      togglePassword.querySelector(".sr-only").textContent =
        showingPassword ? "Hide password" : "Show password";
    });

    loginForm.addEventListener("submit", () => {
      signInButton.disabled = true;
      signInButton.classList.add("is-loading");
      signInButtonText.textContent = "Signing in…";
      loginStatus.textContent = "Signing in. Please wait.";
      loginForm.setAttribute("aria-busy", "true");
    });
  </script>
</body>
</html>
